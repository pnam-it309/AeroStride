global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'aerostride-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['aerostride-be:8080']
        labels:
          application: 'aerostride-backend'
          environment: 'production'

  - job_name: 'cadvisor'
    scrape_interval: 10s
    static_configs:
      - targets: ['aerostride-cadvisor:8080']
        labels:
          application: 'cadvisor-container-metrics'

