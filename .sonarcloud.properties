# ==============================================================================
# SonarCloud Automatic Analysis Configuration
# ==============================================================================

sonar.exclusions=\
  **/db/migration/**,\
  **/db/seeds/**,\
  **/seed_hoa_don.py,\
  **/node_modules/**,\
  **/build/**,\
  **/.gradle/**,\
  **/dist/**,\
  **/.expo/**,\
  **/.next/**,\
  **/coverage/**,\
  **/reports/**,\
  **/*.test.*,\
  **/*.spec.*,\
  **/BE/src/main/java/com/example/be/entity/Q*.java,\
  **/BE/src/main/resources/static/**,\
  **/docker/**,\
  **/.github/**

sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/db/**
sonar.issue.ignore.multicriteria.e2.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.sql
sonar.issue.ignore.multicriteria.e3.ruleKey=*
sonar.issue.ignore.multicriteria.e3.resourceKey=**/seed_hoa_don.py

