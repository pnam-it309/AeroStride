# ==============================================================================
# SonarQube / SonarCloud Configuration for AeroStride (Full Monorepo)
# ==============================================================================

# Project Identification
sonar.projectKey=AeroStride
sonar.projectName=AeroStride
sonar.projectVersion=1.45.6
sonar.sourceEncoding=UTF-8

# Source & Test Scope
sonar.sources=BE/src/main/java,FE/src,mobile/src
sonar.tests=BE/src/test/java

# Java Binaries & Bytecode analysis for Sonar Java
sonar.java.binaries=BE/build/classes/java/main
sonar.java.libraries=BE/build/libs/*.jar

# JaCoCo Code Coverage Report
sonar.coverage.jacoco.xmlReportPaths=BE/build/reports/jacoco/test/jacocoTestReport.xml

# Exclusions
sonar.exclusions=\
  **/db/migration/**,\
  **/db/seeds/**,\
  **/node_modules/**,\
  **/build/**,\
  **/.gradle/**,\
  **/dist/**,\
  **/.expo/**,\
  **/.next/**,\
  **/coverage/**,\
  **/reports/**,\
  **/*.test.*,\
  **/*.spec.*,\
  **/BE/src/main/java/com/example/be/entity/Q*.java,\
  **/BE/src/main/resources/static/**,\
  **/docker/**

# Test Exclusions
sonar.test.inclusions=\
  BE/src/test/java/**/*.java,\
  FE/src/**/__tests__/**/*.js,\
  FE/src/**/*.spec.js,\
  FE/src/**/*.test.js

# Ignore rule issues on database sample seeds and migrations
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/db/**
sonar.issue.ignore.multicriteria.e2.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.sql
