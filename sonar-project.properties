# ==============================================================================
# SonarCloud Configuration for AeroStride (Full Monorepo)
# ==============================================================================

# Project Identification
sonar.organization=pnam-it309
sonar.projectKey=pnam-it309_AeroStride
sonar.projectName=AeroStride
sonar.projectVersion=1.45.7
sonar.sourceEncoding=UTF-8

# Language Specifications
sonar.python.version=3.11
sonar.javascript.environments=browser,node

# Source & Test Scope
sonar.sources=BE/src/main/java,FE/src,mobile/src
sonar.tests=BE/src/test/java

# Java Binaries & Bytecode analysis for Sonar Java
sonar.java.binaries=BE/build/classes/java/main
sonar.java.libraries=BE/build/libs/*.jar

# JaCoCo Code Coverage Report
sonar.coverage.jacoco.xmlReportPaths=BE/build/reports/jacoco/test/jacocoTestReport.xml

# Exclusions
sonar.exclusions=\
  **/db/migration/**,\
  **/db/seeds/**,\
  **/node_modules/**,\
  **/build/**,\
  **/.gradle/**,\
  **/dist/**,\
  **/.expo/**,\
  **/.next/**,\
  **/coverage/**,\
  **/reports/**,\
  **/*.test.*,\
  **/*.spec.*,\
  **/BE/src/main/java/com/example/be/entity/Q*.java,\
  **/BE/src/main/resources/static/**,\
  **/BE/src/main/resources/templates/email/**,\
  **/automation-tests/**,\
  **/mobile/scripts/**,\
  **/docker/**,\
  **/.github/**,\
  **/seed_hoa_don.py

# Test Exclusions
sonar.test.inclusions=\
  BE/src/test/java/**/*.java,\
  FE/src/**/__tests__/**/*.js,\
  FE/src/**/*.spec.js,\
  FE/src/**/*.test.js

# Ignore rule issues on database sample seeds and migrations
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/db/**
sonar.issue.ignore.multicriteria.e2.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.sql
sonar.issue.ignore.multicriteria.e3.ruleKey=*
sonar.issue.ignore.multicriteria.e3.resourceKey=**/seed_hoa_don.py
sonar.issue.ignore.multicriteria.e4.ruleKey=text:S8569
sonar.issue.ignore.multicriteria.e4.resourceKey=BE/build.gradle
sonar.issue.ignore.multicriteria.e5.ruleKey=Web:S6853
sonar.issue.ignore.multicriteria.e5.resourceKey=FE/src/**/*.vue
sonar.issue.ignore.multicriteria.e6.ruleKey=Web:TableHeaderHasIdOrScopeCheck
sonar.issue.ignore.multicriteria.e6.resourceKey=FE/src/**/*.vue
sonar.issue.ignore.multicriteria.e7.ruleKey=Web:InputWithoutLabelCheck
sonar.issue.ignore.multicriteria.e7.resourceKey=FE/src/**/*.vue
sonar.issue.ignore.multicriteria.e8.ruleKey=Web:S5256
sonar.issue.ignore.multicriteria.e8.resourceKey=FE/src/**/*.vue
