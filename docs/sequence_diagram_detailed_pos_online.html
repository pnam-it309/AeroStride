<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sequence Diagram - Bán Hàng Tại Quầy (POS) & Online</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      
      --actor-bg-khach: #e0f2fe;
      --actor-border-khach: #0284c7;
      --actor-bg-nv: #fef3c7;
      --actor-border-nv: #d97706;
      --actor-bg-fe: #dcfce7;
      --actor-border-fe: #16a34a;
      --actor-bg-be: #ede9fe;
      --actor-border-be: #7c3aed;
      --actor-bg-hd: #ffe4e6;
      --actor-border-hd: #e11d48;
      --actor-bg-sp: #ffedd5;
      --actor-border-sp: #ea580c;

      --text-dark: #0f172a;
      --arrow-color: #1e293b;
      --highlight-color: #2563eb;
      --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: #f1f5f9;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .toolbar {
      width: 100%;
      max-width: 1040px;
      background: var(--card-bg);
      padding: 14px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      background: #e2e8f0;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover { background: #cbd5e1; }
    .btn.active {
      background: var(--highlight-color);
      color: #ffffff;
      border-color: var(--highlight-color);
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.3);
    }

    .paper-container {
      width: 100%;
      max-width: 1040px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      padding: 36px 36px 48px;
      position: relative;
    }

    /* Paper Header */
    .paper-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 16px;
      margin-bottom: 30px;
    }

    .brand-fpt { display: flex; flex-direction: column; }
    .brand-fpt .sub { font-size: 11px; font-weight: 700; color: #0054a6; letter-spacing: 0.5px; }
    .brand-fpt .main { font-size: 16px; font-weight: 900; color: #f37021; letter-spacing: 0.5px; }

    .page-number { font-size: 18px; font-weight: 600; color: #475569; }

    .brand-udpm {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 800;
      font-size: 14px;
      color: #1e293b;
      border: 2px dashed #94a3b8;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .brand-udpm span { color: #f37021; }

    /* SVG Styling */
    .diagram-svg { width: 100%; height: auto; overflow: visible; }

    .actor-box { rx: 6px; ry: 6px; stroke-width: 1.5px; }
    .actor-box.khach { fill: var(--actor-bg-khach); stroke: var(--actor-border-khach); }
    .actor-box.nv    { fill: var(--actor-bg-nv);    stroke: var(--actor-border-nv); }
    .actor-box.fe    { fill: var(--actor-bg-fe);    stroke: var(--actor-border-fe); }
    .actor-box.be    { fill: var(--actor-bg-be);    stroke: var(--actor-border-be); }
    .actor-box.hd    { fill: var(--actor-bg-hd);    stroke: var(--actor-border-hd); }
    .actor-box.sp    { fill: var(--actor-bg-sp);    stroke: var(--actor-border-sp); }

    .actor-text {
      fill: #0f172a;
      font-weight: 700;
      font-size: 12px;
      text-anchor: middle;
      dominant-baseline: middle;
      font-family: var(--font-family);
    }

    .lifeline-line { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 4; }

    .activation-bar {
      fill: #ffffff; stroke: #334155; stroke-width: 1.2px; rx: 3px; ry: 3px;
    }

    .msg-group { transition: opacity 0.3s ease; cursor: pointer; }
    .msg-group:hover .msg-arrow { stroke: var(--highlight-color); stroke-width: 2.2px; }
    .msg-group:hover .msg-text { fill: var(--highlight-color); font-weight: 700; }
    .msg-group:hover .msg-bg { fill: #eff6ff; stroke: #bfdbfe; }

    .msg-arrow { stroke: var(--arrow-color); stroke-width: 1.5px; fill: none; transition: stroke 0.2s ease; }
    .msg-arrow.dashed { stroke-dasharray: 4 4; }

    .msg-text {
      font-size: 11px; font-weight: 600; fill: #1e293b; text-anchor: middle; font-family: var(--font-family);
    }

    .msg-bg { fill: rgba(255, 255, 255, 0.95); stroke: #cbd5e1; stroke-width: 0.8px; rx: 3px; ry: 3px; }

    /* Rect grouping boxes */
    .rect-box { fill-opacity: 0.4; stroke-width: 1.5px; rx: 6px; }
    .rect-box.pos { fill: #e8f5e9; stroke: #2e7d32; }
    .rect-box.online { fill: #e1f5fe; stroke: #0288d1; }

    .rect-label-bg { fill: #ffffff; stroke-width: 1px; rx: 4px; ry: 4px; }
    .rect-label-bg.pos { stroke: #2e7d32; }
    .rect-label-bg.online { stroke: #0288d1; }

    .rect-label-text { font-size: 11px; font-weight: 700; font-family: var(--font-family); }
    .rect-label-text.pos { fill: #1b5e20; }
    .rect-label-text.online { fill: #01579b; }

    .diagram-caption {
      text-align: center; margin-top: 36px; font-family: 'Times New Roman', Times, serif;
      font-size: 18px; font-weight: 700; font-style: italic; color: #0f172a;
    }

    .dimmed { opacity: 0.15; }
    .highlighted { opacity: 1 !important; }
  </style>
</head>
<body>

  <!-- Controls Toolbar -->

    <div class="filter-buttons">
      <button class="btn active" onclick="filterFlow('all', this)">Tất cả (All)</button>
      <button class="btn" onclick="filterFlow('pos', this)">1.1 Bán tại quầy (POS)</button>
      <button class="btn" onclick="filterFlow('online', this)">1.2 Đặt hàng Online</button>

  </div>

  <!-- Document Paper Canvas -->

      <line x1="395" y1="65" x2="395" y2="1005" class="lifeline-line"/>

    <!-- Diagram Caption -->
    <div class="diagram-caption">
      Hình 4.3: Sơ đồ luồng nghiệp vụ chi tiết Bán hàng tại quầy (POS) & Bán hàng Online.
    </div>

  </div>

  <script>
    function filterFlow(flowId, btnElement) {
      document.querySelectorAll('.filter-buttons .btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      const allMsgGroups = document.querySelectorAll('.msg-group');
      const allActivationBars = document.querySelectorAll('.activation-bar');

      if (flowId === 'all') {
        allMsgGroups.forEach(el => el.classList.remove('dimmed', 'highlighted'));
        allActivationBars.forEach(el => el.classList.remove('dimmed', 'highlighted'));
      } else {
        allMsgGroups.forEach(el => {
          if (el.classList.contains(flowId)) {
            el.classList.remove('dimmed');
            el.classList.add('highlighted');
          } else {
            el.classList.add('dimmed');
            el.classList.remove('highlighted');
          }
        });

        allActivationBars.forEach(el => {
          if (el.classList.contains(flowId)) {
            el.classList.remove('dimmed');
            el.classList.add('highlighted');
          } else {
            el.classList.add('dimmed');
            el.classList.remove('highlighted');
          }
        });
      }
    }
  </script>
</body>
</html>
