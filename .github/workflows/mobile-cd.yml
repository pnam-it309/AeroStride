name: AeroStride Mobile CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-cd.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Setup Expo EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Build Android APK on EAS
        working-directory: ./mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile preview --non-interactive --json > eas-build-result.json
          cat eas-build-result.json

      - name: Update APK link in README & version manifest
        working-directory: ./mobile
        run: node scripts/update-release-info.js eas-build-result.json

      - name: Commit updated release info
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898026+github-actions[bot]@users.noreply.github.com"
          git add README.md mobile/app-version.json
          if git diff --cached --quiet; then
            echo "No release info changes to commit."
          else
            git commit -m "chore(mobile): update APK download link to latest build [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
