name: AeroStride Mobile CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-cd.yml'
  workflow_dispatch:

permissions:
  contents: write

# Only one build at a time: concurrent runs race on the release-info commit.
concurrency:
  group: mobile-cd
  cancel-in-progress: false

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Setup Expo EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Publish OTA update (EAS Update)
        working-directory: ./mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://aerostride.onrender.com
        run: |
          eas update --channel preview --message "$(git log -1 --pretty=%s)" --non-interactive

      - name: Build Android APK on EAS
        working-directory: ./mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile preview --non-interactive --json > eas-build-result.json
          cat eas-build-result.json

      - name: Upload EAS Build Result
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-result
          path: mobile/eas-build-result.json
          if-no-files-found: ignore

      - name: Update release info & commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898026+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            node mobile/scripts/update-release-info.js mobile/eas-build-result.json
            git add README.md mobile/app-version.json
            if git diff --cached --quiet; then
              echo "No release info changes to commit."
              break
            fi
            git commit -m "chore(mobile): update APK download link to latest build [skip ci]"
            if git push origin main; then
              break
            fi
            echo "Push rejected (attempt $attempt), retrying against latest main..."
          done
