name: SonarCloud Code Analysis

on:
  push:
    branches:
      - main
      - "releases/*"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('BE/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build Backend & Generate Test Coverage
        run: |
          cd BE
          chmod +x gradlew
          ./gradlew test jacocoTestReport --no-daemon

      - name: Setup Node.js (for JS/TS and tsconfig resolution)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies for Analysis
        run: |
          cd mobile && npm ci --ignore-scripts || true

      - name: Check SONAR_TOKEN
        id: check-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning::SONAR_TOKEN secret is not set in GitHub repository secrets. If using SonarCloud Automatic Analysis, SonarCloud scans via GitHub App integration. To scan via this workflow, add SONAR_TOKEN in Settings > Secrets."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: SonarCloud Scan
        if: steps.check-token.outputs.has_token == 'true'
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dproject.settings=sonar-project.properties
