spring.application.name=AeroStride-BE
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Escape hatch for disabling auto-configs at runtime without a rebuild.
spring.autoconfigure.exclude=${SPRING_AUTOCONFIGURE_EXCLUDE:}

# Server Configuration
server.port=${SERVER_PORT:8080}
app.base_url=${APP_BASE_URL:http://localhost:8080}
app.api_prefix=${APP_API_PREFIX:/api/v1}
# Public origin a BROWSER uses to reach the site - the frontend, which is not the
# same host as the API during local dev (5173 vs 8080). Used for absolute SEO URLs
# such as the product sitemap. Behind the prod nginx both collapse onto one origin,
# hence the fallback to app.base_url.
app.public_url=${APP_PUBLIC_URL:${APP_BASE_URL:http://localhost:8080}}
app.frontend_url=${APP_FRONTEND_URL:${app.public_url}}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seeds
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.clean-on-validation-error=false
spring.flyway.clean-disabled=true
spring.flyway.encoding=UTF-8

# Mail Configuration (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

# Resend Mail Configuration (HTTP API over HTTPS port 443 - Không bị chặn bởi Render)
resend.api_key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:AeroStride <onboarding@resend.dev>}

# Thymeleaf Configuration for Emails
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Custom App Properties
allowed.origin=${ALLOWED_ORIGIN:}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false
spring.cache.type=${SPRING_CACHE_TYPE:none}

# VNPay Configuration
vnpay.tmn_code=${VNP_TMN_CODE:CGXZLS0Z}
vnpay.hash_secret=${VNP_HASH_SECRET:XBAIVFZIFUPHFPGMVKEYNJYHEXIPWWBM}
vnpay.url=${VNP_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.client_ip=${VNP_CLIENT_IP:127.0.0.1}

# Order Configuration
order.cleanup.threshold_ms=${ORDER_CLEANUP_THRESHOLD_MS:86400000}

# Guest Chat Cleanup: xóa lịch sử chat khách vãng lai (chưa đăng nhập) không hoạt động.
guest.chat.cleanup.threshold-ms=${GUEST_CHAT_CLEANUP_THRESHOLD_MS:1800000}
guest.chat.cleanup.interval-ms=${GUEST_CHAT_CLEANUP_INTERVAL_MS:300000}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh_expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Local Storage
app.local-upload-dir=${APP_LOCAL_UPLOAD_DIR:.local-uploads}

# Batch
batch.excel.file-path=${BATCH_EXCEL_FILE_PATH:}

# Actuator Configuration
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_SHOW_DETAILS:never}
management.health.mail.enabled=false
management.health.redis.enabled=false

# Spring Batch Configuration
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Console Decoration
spring.output.ansi.enabled=always
logging.pattern.console=${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %yellow(%-5level) %red([%thread]) %blue(%logger{255}) - %msg%n}

# Performance: Hikari Connection Pool (tuned for small containers)
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Performance: Tomcat Timeout
server.tomcat.connection-timeout=20000

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.web.reactive.function.client=WARN
logging.level.reactor.netty.http.client=WARN

# Hot Reload Configuration (Docker on Windows)
spring.devtools.restart.enabled=${SPRING_DEVTOOLS_RESTART_ENABLED:false}
spring.devtools.restart.poll-interval=${SPRING_DEVTOOLS_RESTART_POLL_INTERVAL:3s}
spring.devtools.restart.quiet-period=${SPRING_DEVTOOLS_RESTART_QUIET_PERIOD:2s}
spring.devtools.restart.additional-exclude=.gradle/**,.git/**

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false

# OpenAI / Ollama Chatbot
openai.api-key=${OPENAI_API_KEY:ollama}
openai.model=${OPENAI_MODEL:qwen2.5:3b}
openai.base-url=${OPENAI_BASE_URL:http://localhost:11434/v1}

# Spring AI Configuration (OpenAI as primary for MCP)
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.chat.client.enabled=${SPRING_AI_CHAT_CLIENT_ENABLED:false}
spring.ai.openai.api-key=${OPENAI_API_KEY:ollama}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:qwen2.5:3b}

# Spring AI MCP Configuration
spring.ai.mcp.client.enabled=${MCP_CLIENT_ENABLED:false}
spring.ai.mcp.client.name=aerostride-mcp-client
spring.ai.mcp.client.type=async
spring.ai.mcp.client.sse.connections.my-mcp-server.url=${MCP_SERVER_URL:http://localhost:3000}

# GHN Configuration
ghn.api.url=${GHN_API_URL:https://online-gateway.ghn.vn/shiip/public-api}
ghn.api.token=${GHN_TOKEN:fdb81d8d-7a95-11f1-bbaf-067d8cac0ce0}
ghn.api.shopId=${GHN_SHOP_ID:6535667}
ghn.api.shopAddress=${GHN_SHOP_ADDRESS:6 Trinh Van Bo, Hoe Thi, Xuan Phuong, Nam Tu Liem, Ha Noi, Viet Nam}
ghn.api.fromProvinceName=${GHN_FROM_PROVINCE_NAME:Ha Noi}
ghn.api.fromDistrictName=${GHN_FROM_DISTRICT_NAME:Nam Tu Liem}
ghn.api.fromWardName=${GHN_FROM_WARD_NAME:Xuan Phuong}
ghn.api.fromDistrictId=${GHN_FROM_DISTRICT_ID:3440}
ghn.api.fromWardCode=${GHN_FROM_WARD_CODE:}
ghn.api.packageLength=${GHN_PACKAGE_LENGTH:20}
ghn.api.packageWidth=${GHN_PACKAGE_WIDTH:15}
ghn.api.packageHeight=${GHN_PACKAGE_HEIGHT:10}
